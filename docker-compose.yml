# One command to run the whole thing on PostgreSQL:
#   docker compose up --build
# then open http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopfloor
      POSTGRES_USER: shopfloor
      POSTGRES_PASSWORD: shopfloor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfloor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopfloor
      SPRING_DATASOURCE_USERNAME: shopfloor
      SPRING_DATASOURCE_PASSWORD: shopfloor
      SHOPFLOOR_JWT_SECRET: change-me-in-production-0123456789abcdef0123456789
    ports:
      - "8080:8080"
